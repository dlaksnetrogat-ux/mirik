{% extends "base.html" %}
{% block title %}Регистрация — Mirik{% endblock %}

{% block content %}
<style>
.telegram-login-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 14px;border-radius:10px;background:#2AABEE;color:#fff;font-weight:600;text-decoration:none;transition:.15s ease}.telegram-login-btn:hover{background:#229ed9}.telegram-icon{font-size:17px}.auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:12px}.auth-divider:before,.auth-divider:after{content:"";height:1px;flex:1;background:var(--border)}
</style>
<main class="auth-container">
    <div class="brand">MIRIK</div>
    <h1>Создать аккаунт</h1>
    <p class="muted">Выберите удобный способ регистрации.</p>

    {% if telegram_enabled %}
        <a href="{{ url_for('telegram_login') }}" class="telegram-login-btn">
            <span class="telegram-icon">✈</span>
            <span>Создать аккаунт через Telegram</span>
        </a>
        <div class="auth-divider"><span>или по email</span></div>
    {% endif %}

    <form method="POST" class="auth-form" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" maxlength="120" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">Повторите пароль</label>
            <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit" class="btn-primary">Зарегистрироваться</button>
    </form>

    <p class="auth-links">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
</main>
{% endblock %}
