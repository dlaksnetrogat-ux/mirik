{% extends "base.html" %}
{% block title %}Вход — Mirik{% endblock %}

{% block content %}
<style>
.telegram-login{display:flex;justify-content:center;margin-bottom:4px}.telegram-login iframe{max-width:100%}.telegram-fallback{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 14px;border-radius:10px;background:#2AABEE;color:#fff;font-weight:600;text-decoration:none;transition:.15s ease}.telegram-fallback:hover{background:#229ed9}.auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:12px}.auth-divider:before,.auth-divider:after{content:"";height:1px;flex:1;background:var(--border)}
</style>
<main class="auth-container">
    <div class="brand">MIRIK</div>
    <h1>С возвращением 👋</h1>
    <p class="muted">Войдите, чтобы продолжить общение.</p>

    {% if telegram_enabled %}
        <div class="telegram-login">
            <script async src="https://telegram.org/js/telegram-widget.js?22"
                    data-telegram-login="{{ telegram_bot_username }}"
                    data-size="large"
                    data-userpic="false"
                    data-auth-url="{{ url_for('telegram_callback', _external=True) }}"
                    data-request-access="write">
            </script>
        </div>
        <div class="auth-divider"><span>или</span></div>
    {% endif %}

    <form method="POST" class="auth-form" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" maxlength="120" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary">Войти</button>
    </form>

    <p class="auth-links">Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
</main>
{% endblock %}
