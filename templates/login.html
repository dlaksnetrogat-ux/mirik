{% extends "base.html" %}
{% block title %}Вход — Mirik{% endblock %}

{% block content %}
<style>
.telegram-login-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 14px;border:0;border-radius:10px;background:#2AABEE;color:#fff;font-weight:600;cursor:pointer;transition:.15s ease}.telegram-login-btn:hover{background:#229ed9}.telegram-icon{font-size:17px}.auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:12px}.auth-divider:before,.auth-divider:after{content:"";height:1px;flex:1;background:var(--border)}.telegram-error{margin-top:8px;color:var(--danger);font-size:12px;text-align:center;min-height:18px}
</style>
<main class="auth-container">
    <div class="brand">MIRIK</div>
    <h1>С возвращением 👋</h1>
    <p class="muted">Войдите, чтобы продолжить общение.</p>

    {% if telegram_enabled %}
        <button type="button" id="telegram-login-button" class="telegram-login-btn">
            <span class="telegram-icon">✈</span>
            <span>Войти через Telegram</span>
        </button>
        <div id="telegram-error" class="telegram-error"></div>
        <div class="auth-divider"><span>или</span></div>
        <script src="https://telegram.org/js/telegram-login.js?3"></script>
        <script>
        (() => {
            const button = document.getElementById('telegram-login-button');
            const errorBox = document.getElementById('telegram-error');
            const clientId = Number({{ telegram_client_id|tojson }});
            const nonce = {{ telegram_nonce|tojson }};
            const callbackUrl = {{ url_for('telegram_callback', _external=True)|tojson }};
            const showError = (message) => { errorBox.textContent = message || 'Не удалось войти через Telegram.'; };

            Telegram.Login.init({client_id: clientId, scope: ['profile'], nonce: nonce}, async (data) => {
                if (data && data.error) { showError(data.error); return; }
                if (!data || !data.id_token) { showError('Telegram не вернул токен входа.'); return; }
                try {
                    const response = await fetch(callbackUrl, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id_token:data.id_token})});
                    window.location.href = response.url;
                } catch (_) { showError('Не удалось связаться с сервером Mirik.'); }
            });
            button.addEventListener('click', () => Telegram.Login.open());
        })();
        </script>
    {% endif %}

    <form method="POST" class="auth-form" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" maxlength="120" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary">Войти</button>
    </form>

    <p class="auth-links">Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
</main>
{% endblock %}
